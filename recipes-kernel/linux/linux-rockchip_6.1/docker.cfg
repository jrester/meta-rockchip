# Network bridge and virtual Ethernet (required for Docker networking)
CONFIG_BRIDGE=y
CONFIG_BRIDGE_IGMP_SNOOPING=y
CONFIG_BR_NETFILTER=y
CONFIG_VETH=y
CONFIG_DUMMY=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y

# POSIX message queues (required for container /dev/mqueue mount)
CONFIG_POSIX_MQUEUE=y
CONFIG_POSIX_MQUEUE_SYSCTL=y

# Device mapper (required for /dev/mapper/control — Docker container runtime)
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y

# ip6tables base module (supervisor calls modprobe ip6_tables)
CONFIG_IP6_NF_IPTABLES=y

# Gigabit Ethernet — RK3588 GMAC (stmmac platform driver)
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_PTP_1588_CLOCK=y
CONFIG_PHYLIB=y
CONFIG_REALTEK_PHY=y

# TUN/TAP device — required for openvpn-resin (balena cloud VPN)
CONFIG_TUN=m

# Quectel EM05-G / EC25-G modem over USB is already supported by the NixOS base config:
# USB_USBNET / USB_NET_DRIVERS are built-in (=y, forced by USB_NET_CDC_NCM=y), and
# USB_NET_QMI_WWAN / USB_WDM / USB_SERIAL / USB_SERIAL_WWAN / USB_SERIAL_OPTION are =m.
# So no overrides here (a =m for usbnet would not take, since CDC_NCM pulls it in built-in).
# NOTE: usbnet is therefore built-in, so do NOT request kernel-module-usbnet in IMAGE_INSTALL.

# Quectel EM05-G power-on driver (Rockchip rm310, compatible "4g-modem-platdata").
# Disabled: running its msleep/gpio kthread in the fragile early-boot window
# destabilized boot. Modem power-on is handled by a post-boot userspace service.
# CONFIG_LTE is not set
# CONFIG_LTE_RM310 is not set

# zram swap device — fixes the boot-time zram0 `/lib/udev/zram-swap-init` failure.
CONFIG_ZRAM=y
CONFIG_ZSMALLOC=y

# WiFi (RTL8852BE) comes from the NixOS base config: CFG80211/MAC80211/WL_ROCKCHIP are
# built-in and the RTL8852BE driver is in-tree (CONFIG_RTW89_8852BE=m), so no out-of-tree
# rtw89 recipe is needed. The prototype's early-boot vmalloc/Mali race that motivated a
# modular WiFi stack was on the older radxa rkr4.1 kernel; the NixOS armbian rkr5.1 tree
# boots with the stack built-in. If that race reappears, re-add CFG80211=m / MAC80211=m
# here and set `# CONFIG_WL_ROCKCHIP is not set`.

# RTL8125 2.5G PCIe NIC — on ROCK 5T, Ethernet is RTL8125 via PCIe (PCI ID 10ec:8125).
# Must be =m (module), NOT =y (built-in): two NICs initializing at T+3s with =y causes
# a vmalloc SMP race in __d_alloc (kernel oops, udevadm crash, kernel panic at T+7s).
# r8169-late-load blacklists automatic alias loading and loads the module from systemd
# after root/userspace are stable, so boot does not depend on Ethernet link state.
CONFIG_R8169=m

# Cgroup controllers (required for Docker container resource limits)
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_BLK_CGROUP=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CPUSETS=y

# Netfilter connection tracking (required for Docker NAT/masquerade)
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CONNTRACK_BROADCAST=y
CONFIG_NF_CONNTRACK_NETLINK=y

# NAT support
CONFIG_NF_NAT=y
CONFIG_NF_NAT_MASQUERADE=y
CONFIG_NF_NAT_REDIRECT=y

# iptables tables (required for Docker iptables rules)
CONFIG_IPTABLE_FILTER=y
CONFIG_IPTABLE_NAT=y
CONFIG_IPTABLE_RAW=y
CONFIG_IP6TABLE_FILTER=y
CONFIG_IP6TABLE_NAT=y
CONFIG_IP6TABLE_RAW=y

# Netfilter XT matches required by Docker
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y
CONFIG_NETFILTER_XT_MATCH_MARK=y
CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_NETFILTER_XT_TARGET_MARK=y
CONFIG_NETFILTER_XT_TARGET_ACCEPT=y

# IPv4 netfilter
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_REDIRECT=y

# IPv6 netfilter
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_NAT=y
CONFIG_IP6_NF_TARGET_MASQUERADE=y
