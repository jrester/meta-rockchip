#@TYPE: Machine
#@NAME: RK3588 ROCK 5T

require conf/machine/include/rk3588.inc

KERNEL_DEVICETREE = "rockchip/rk3588-rock-5t.dtb"

# Bootloader: mainline U-Boot v2025.04 built from source (u-boot-rock5t recipe), replacing
# the radxa 2017.09 u-boot-rockchip default. UBOOT_MACHINE is set (a) so meta-balena makes
# the image depend on virtual/bootloader:do_deploy, and (b) as the defconfig the recipe
# builds. The armbian rock-5t defconfig is added by the recipe's board_rock-5t patches.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-rock5t"
UBOOT_MACHINE = "rock5t-rk3588_defconfig"
